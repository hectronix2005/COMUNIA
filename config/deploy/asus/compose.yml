# Producción de COMUNIA en asus (WSL). Lo lanza bin/deploy desde el Air.
# Secretos fuera del repo: $SECRETS_DIR/{app,db,ts}.env (chmod 600) y las claves de los
# pases en $PASES_DIR (~/.config/comunia-pases, 700). Las evidencias de DENUNCIAPP, en
# $DENUNCIAS_DIR (~/services/denuncias-evidencia, 700): los originales van cifrados con
# DENUNCIAS_CLAVE (app.env), que no está en git ni en Drive.
# URL pública: https://comunia.tail0be41e.ts.net (Funnel del nodo "comunia", sin depender del Air).
name: comunia

services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    env_file: ${SECRETS_DIR}/db.env
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 5s
      retries: 10

  web:
    build: ../../..
    image: comunia-web
    restart: unless-stopped
    env_file: ${SECRETS_DIR}/app.env
    environment:
      HTTP_PORT: "80"
      PASES_DIR: /pases
      DENUNCIAS_DIR: /denuncias
      # Thruster anota la IP y la hora de cada petición; en el host de DENUNCIAPP no puede
      # quedar ninguna. Las de COMUNIA siguen en el log de Rails.
      THRUSTER_LOG_REQUESTS: "false"
    volumes:
      # Claves de los pases de DENUNCIAPP; las genera config/deploy/asus/pases-claves.sh (cron).
      - ${PASES_DIR}:/pases:ro
      - ${DENUNCIAS_DIR}:/denuncias
    depends_on:
      db:
        condition: service_healthy

  ts:
    image: tailscale/tailscale:v1.104.1
    hostname: comunia
    restart: unless-stopped
    env_file: ${SECRETS_DIR}/ts.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
    volumes:
      - tsstate:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - web

  # Nodo propio de DENUNCIAPP (https://denunciapp.tail0be41e.ts.net) hacia la misma web; el host
  # separa el módulo. Solo arranca con el perfil «denunciapp», que bin/deploy activa si existe
  # $SECRETS_DIR/ts-denunciapp.env (TS_AUTHKEY). Sin subida de logs a Tailscale.
  ts-denunciapp:
    image: tailscale/tailscale:v1.104.1
    hostname: denunciapp
    restart: unless-stopped
    profiles: [denunciapp]
    env_file: ${SECRETS_DIR}/ts-denunciapp.env
    environment:
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_TAILSCALED_EXTRA_ARGS: --no-logs-no-support
    volumes:
      - tsdenunciapp:/var/lib/tailscale
      - ./serve.json:/config/serve.json:ro
    depends_on:
      - web

volumes:
  pgdata:
  tsstate:
  tsdenunciapp:
