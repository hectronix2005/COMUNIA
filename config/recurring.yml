development:
  marcar_vencidos:
    class: MarcarVencidosJob
    schedule: at 6am every day
  red_mantenimiento:
    class: Red::MantenimientoDiarioJob
    schedule: at 4am every day

production:
  marcar_vencidos:
    class: MarcarVencidosJob
    schedule: at 6am every day
  # Noticias de internet de las comunidades que las encendieron (Héctor, 2-nov-2026). Hora de Bogotá.
  actualizar_noticias:
    class: ActualizarNoticiasJob
    schedule: at 6:30am every day
  # Resumen del día del rastreo de pruebas a los superadmins (Héctor, 1-nov-2026). Hora de Bogotá.
  resumen_rastreo:
    class: ResumenRastreoJob
    schedule: at 9pm every day
  red_mantenimiento:
    class: Red::MantenimientoDiarioJob
    schedule: at 4am every day
  cumpleanos_notificaciones:
    class: CumpleanosNotificacionJob
    schedule: at 7am every day
  # Lo de la semana a todos los miembros (ResumenSemanalJob); trae los cumpleaños, así que sustituye al antiguo
  # cumpleanos_semana (CumpleanosSemanaJob, que se queda sin programar).
  resumen_semanal:
    class: ResumenSemanalJob
    schedule: every monday at 7:05am
  recordatorio_reuniones:
    class: RecordatorioReunionesJob
    schedule: every hour at minute 20
  recordatorio_eventos:
    class: RecordatorioEventosJob
    schedule: every hour at minute 25
  recordatorio_acuerdos:
    class: RecordatorioAcuerdosJob
    schedule: at 7:10am every day
  demo:
    class: DemoJob
    schedule: at 3:30am every day
  clear_solid_queue_finished_jobs:
    command: "SolidQueue::Job.clear_finished_in_batches(sleep_between_batches: 0.3)"
    schedule: every hour at minute 12
