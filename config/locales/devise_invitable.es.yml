es:
  devise:
    failure:
      # Igual que un usuario o contraseña incorrectos: no se delata que la cuenta tiene una invitación.
      invited: "%{authentication_keys} o contraseña inválidos."
    invitations:
      invitation_token_invalid: El enlace de invitación no es válido o ya caducó. Pide uno nuevo a tu logia.
      updated: Listo, ya tienes contraseña y entraste.
      updated_not_active: Tu contraseña quedó guardada.
      no_invitations_remaining: No te quedan invitaciones.
      invitation_removed: Se retiró la invitación.
      send_instructions: Se generó la invitación.
  activerecord:
    attributes:
      user:
        invitation_token: El enlace de invitación
